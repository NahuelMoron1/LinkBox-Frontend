@if (phase === 'installing') {
  <div class="upd-overlay">
    <div class="upd-card">

      <!-- Header strip -->
      <div class="upd-header">
        <span class="upd-stripe"></span>
        <span class="upd-title">ACTUALIZANDO</span>
      </div>

      <!-- Progress steps -->
      <div class="upd-steps">
        @for (step of stepOrder; track step) {
          <div class="upd-step"
               [class.done]="isStepDone(step)"
               [class.active]="isStepActive(step)">
            <span class="upd-dot"></span>
            <span class="upd-step-label">{{ stepLabels[step] }}</span>
          </div>
        }
      </div>

    </div>
  </div>
}
@if (phase === 'error') {
  <div class="upd-overlay">
    <div class="upd-card upd-card-error">
      <div class="upd-header">
        <span class="upd-stripe"></span>
        <span class="upd-title">ACTUALIZACIÓN FALLIDA</span>
      </div>
      <p class="upd-error-message">{{ errorMessage }}</p>
    </div>
  </div>
}
