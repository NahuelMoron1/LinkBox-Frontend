@if (visible) {
  <div class="toast" [class.toast--success]="type === 'success'" [class.toast--error]="type === 'error'">
    <span class="toast-icon">
      @if (type === 'success') {
        ✓
      } @else {
        ✕
      }
    </span>
    <span class="toast-message">{{ message }}</span>
  </div>
}
